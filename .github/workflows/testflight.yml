name: TestFlight

# 開発用Mac（macOS 12 / Xcode 14.2）ではApp Store Connectが要求するSDKに届かないため、
# 提出用ビルドはこのワークフローで作る。
#
# 必要なGitHub Secrets（Settings > Secrets and variables > Actions で登録）:
#   APP_STORE_CONNECT_ISSUER_ID  … App Store Connect > Users and Access > Integrations の Issuer ID
#   APP_STORE_CONNECT_KEY_ID     … 同ページで作成したAPIキーの Key ID
#   APP_STORE_CONNECT_PRIVATE_KEY… 同キーの .p8 ファイルの中身をそのまま貼る
#
# APIキーの役割は「Admin」で作ること。過去に「App Manager」で作ったところ
# クラウド署名（-allowProvisioningUpdates）が失敗した実績があるため。

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "ビルド番号（アップロードのたびに増やす）"
        required: true
        default: "1"

jobs:
  archive-and-upload:
    # macos-15のXcodeは16.x系で、App Store Connectが要求するiOS 26 SDKに届かない。
    # Xcode 26系が入っているmacos-26を使うこと。
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: 最新のXcodeを選択してSDKを検証
        run: |
          ls /Applications | grep -i "^Xcode"
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

          # App Store Connectは2026年4月28日以降、iOS 26 SDK以降でのビルドしか受け付けない。
          # ここで弾いておかないと、アーカイブ成功後のアップロードで初めて失敗する。
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "iOS SDK: $SDK"
          if [ "$SDK" -lt 26 ]; then
            echo "::error::iOS SDK $SDK は古すぎます（26以上が必要）。ランナーのイメージを確認してください。"
            exit 1
          fi

      - name: App Store Connect APIキーを配置
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: ビルド番号を設定
        run: |
          /usr/bin/sed -i '' \
            "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};/g" \
            DailyPieChart.xcodeproj/project.pbxproj
          grep -m1 "CURRENT_PROJECT_VERSION" DailyPieChart.xcodeproj/project.pbxproj

      - name: アーカイブ
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          xcodebuild -project DailyPieChart.xcodeproj \
            -scheme DailyPieChart \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DailyPieChart.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive

      # ランナーは実行後に破棄されるので、アーカイブを残しておく。
      # dSYMを含むため、後からクラッシュログをシンボル化したり、
      # 同じビルドを別の方法で再書き出ししたりできる。
      # 書き出しで失敗したときにも中身を調べられるよう always() で走らせる。
      - name: アーカイブを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DailyPieChart-${{ inputs.build_number }}-xcarchive
          path: build/DailyPieChart.xcarchive
          retention-days: 30
          if-no-files-found: ignore

      - name: ipaを書き出す
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>Y5RBKYD4FY</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/DailyPieChart.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 後片付け
        if: always()
        run: rm -rf ~/private_keys
